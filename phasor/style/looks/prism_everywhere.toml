description = "The prism look on everything: every glowing curve (graphs, Fourier sums and epicycles, parametric curves, contours, diagrams) runs the spectrum along its length and lets it drift, with warm and cool fringes, darker corners and drifting equations. Axes and grids stay plain. An option: the default stays midnight_glow."
theme = "prism_vivid"
life = "lively"

[defaults.line.params]
hue_along = 0.8

[defaults.line.style]
glow = "strong"
stroke = "regular"

[defaults.dot.style]
glow = "strong"
color = "primary"

[defaults.equation.style]
glow = "soft"

[defaults.text.style]
color = "primary"

[defaults.domain_coloring.params]
softness = 0.7

