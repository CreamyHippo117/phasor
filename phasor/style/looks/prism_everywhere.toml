description = "The prism look on everything: every glowing curve (graphs, Fourier sums and epicycles, parametric curves, contours, diagrams) runs the spectrum along its length and lets it drift, with warm and cool fringes, darker corners and drifting equations. Axes and grids stay plain. An option: the default stays midnight_glow."
theme = "prism_vivid"
life = "lively"

[defaults.line.params]
dim = 0.9  # a little see-through: what is behind glows through
hue_along = 0.8

[defaults.line.style]
glow = "strong"
stroke = "regular"

[defaults.dot.style]
glow = "strong"
color = "primary"

[defaults.equation.style]
glow = "soft"

[defaults.text.style]
color = "primary"

[defaults.domain_coloring.params]  # the prism preset: glowing zeros, poles, rays and rings
dim = 0.88  # a little see-through: what is behind glows through
radius = 0.35
ambient = 0.06
contour = 0.0
lines = 12

[defaults.domain_coloring.style]
glow = "strong"

[defaults.fractal.style]
colormap = "ocean"

[defaults.epicycles.style]
glow = "strong"

[defaults.graph.style]
glow = "strong"

