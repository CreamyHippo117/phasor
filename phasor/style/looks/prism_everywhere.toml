[defaults.permutation.style]
glow = "strong"

[defaults.wavefront.style]
glow = "strong"

[defaults.flow_lines.style]
glow = "strong"

[defaults.arrow.style]
glow = "soft"

[defaults.riemann_sum.style]
glow = "soft"

[defaults.spectrum.style]
