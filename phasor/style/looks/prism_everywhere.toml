[defaults.pde_profile.style]
glow = "strong"

[defaults.pde_modes.style]
glow = "strong"

[defaults.impulse_response.style]
glow = "strong"

[defaults.eigen_lines.style]
glow = "strong"

[defaults.polygon.style]
glow = "strong"

[defaults.cayley_graph.style]
