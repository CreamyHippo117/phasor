description = "The owner's reference look: near-black, curves glowing with warm and cool fringes and a hue running along them, drifting equations, darker corners. No axes unless a scene asks."
theme = "prism"
life = "lively"

[defaults.line.params]
hue_along = 0.8

[defaults.line.style]
glow = "strong"
stroke = "regular"

[defaults.dot.style]
glow = "strong"
color = "primary"

[defaults.equation.style]
glow = "soft"

[defaults.text.style]
color = "primary"

[defaults.domain_coloring.params]  # the prism preset: glowing zeros, poles, rays and rings
radius = 0.35
ambient = 0.06
contour = 0.0
lines = 12

[defaults.domain_coloring.style]
glow = "strong"

[defaults.fractal.params]  # the prism preset: the set dark, its edge glowing (BEAUTY.md item 4)
radius = 0.01
ambient = 0.03

[defaults.fractal.style]
colormap = "ocean"
glow = "soft"  # owner 2026-11-22: strong glow whited out the dense filaments of a dive

# heat maps: smooth, dark where quiet and glowing where strong in spectrum hues that
# run with the value, contour lines of light, edges melting into the dark
# (BEAUTY.md item 2; the same values as heatmap.PRISM)
[defaults.pde_field.params]
smooth = true
isolines = 8
hue_cycles = 1.6
fade = 0.1
ambient = 0.0
contrast = 2.0

[defaults.pde_field.style]
glow = "soft"
colormap = "spectrum"

[defaults.pde_slice.params]
smooth = true
isolines = 8
hue_cycles = 1.6
fade = 0.1
ambient = 0.0
contrast = 2.0

[defaults.pde_slice.style]
glow = "soft"
colormap = "spectrum"

[defaults.pressure_slice.params]
smooth = true
isolines = 8
hue_cycles = 1.6
fade = 0.1
ambient = 0.0
contrast = 2.0

[defaults.pressure_slice.style]
glow = "soft"
colormap = "spectrum"

[defaults.spectrogram.params]
smooth = true
isolines = 8
hue_cycles = 1.6
fade = 0.1
ambient = 0.0
contrast = 2.0

[defaults.spectrogram.style]
glow = "soft"
colormap = "spectrum"

# point clouds: palette hue, glow and haze (BEAUTY.md item 3)
[defaults.point_cloud.params]
exposure = 0.06
point_size = 0.9

[defaults.point_cloud.style]
colormap = "spectrum"
glow = "strong"
