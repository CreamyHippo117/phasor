description = "The owner's reference look: near-black, curves glowing with warm and cool fringes and a hue running along them, drifting equations, darker corners. No axes unless a scene asks."
theme = "prism"
life = "lively"

[defaults.line.params]
dim = 0.9  # a little see-through: what is behind glows through
hue_along = 0.8

[defaults.line.style]
glow = "strong"
stroke = "regular"

[defaults.dot.style]
glow = "strong"
color = "primary"

[defaults.equation.style]
glow = "soft"

[defaults.text.style]
color = "primary"

[defaults.domain_coloring.params]  # the prism preset: glowing zeros, poles, rays and rings
dim = 0.88  # a little see-through: what is behind glows through
radius = 0.35
ambient = 0.06
contour = 0.0
lines = 12

[defaults.domain_coloring.style]
glow = "strong"

[defaults.fractal.style]
colormap = "ocean"

# heat maps: smooth, glowing where strong, contour lines of light (BEAUTY.md item 2)
[defaults.pde_field.params]
dim = 0.88  # a little see-through: what is behind glows through
smooth = true
isolines = 8

[defaults.pde_field.style]
glow = "soft"

[defaults.pde_slice.params]
dim = 0.88  # a little see-through: what is behind glows through
smooth = true
isolines = 8

[defaults.pde_slice.style]
glow = "soft"

[defaults.pressure_slice.params]
dim = 0.88  # a little see-through: what is behind glows through
smooth = true
isolines = 8

[defaults.pressure_slice.style]
glow = "soft"

[defaults.spectrogram.params]
dim = 0.88  # a little see-through: what is behind glows through
smooth = true
isolines = 8

[defaults.spectrogram.style]
glow = "soft"

[defaults.counter.style]
glow = "soft"

[defaults.flow_particles.style]
glow = "strong"

[defaults.network.params]
color_by = "depth"
dim = 0.75  # graphs stack many edges: a little dimmer, so crossings do not pile up to white

[defaults.network.style]
glow = "soft"

# the rest of the prism look (owner, 2026-11-22): everything but axes and photos
[defaults.cayley_table.style]
glow = "soft"

[defaults.clock_diagram.style]
glow = "strong"

[defaults.matrix.style]
glow = "soft"

[defaults.room.style]
glow = "strong"

[defaults.parametric_surface.style]
material = "glass"

[defaults.pde_surface.style]
material = "glass"

[defaults.riemann_surface.style]
material = "glass"

# dynamical systems (ANIMATIONS.md D1, D2): trajectories glow, the arrow field and nullclines stay faint
[defaults.phase_portrait.params]
dim = 0.9
flow = true

[defaults.phase_portrait.style]
glow = "strong"

[defaults.fixed_points.style]
glow = "strong"

# linear systems (ANIMATIONS.md D5): the same glow as the phase portrait, modes and grid are the linalg objects'
[defaults.linear_system.params]
dim = 0.9  # a little see-through, as the phase portrait

[defaults.linear_system.style]
glow = "strong"

# live convolution (ANIMATIONS.md S1): two glowing signals, the product lit, the output as light
[defaults.convolution.params]
dim = 0.92

[defaults.convolution.style]
glow = "strong"

# filtering (ANIMATIONS.md S3): the plane's markers and the response curves glow, bars glow softly
[defaults.pole_zero.params]
dim = 0.9  # a little see-through, like the other prism types

[defaults.pole_zero.style]
glow = "strong"

[defaults.frequency_response.params]
dim = 0.9  # a little see-through, like the other prism types

[defaults.frequency_response.style]
glow = "strong"

[defaults.filtered_signal.params]
dim = 0.9  # a little see-through, like the other prism types

[defaults.filtered_signal.style]
glow = "strong"

[defaults.filtered_spectrum.params]
dim = 0.9  # a little see-through, like the other prism types

[defaults.filtered_spectrum.style]
glow = "soft"

[defaults.winding.params]
hue_along = 1.0

[defaults.winding.style]
glow = "strong"

[defaults.directivity.style]
glow = "strong"

[defaults.doppler.style]
glow = "strong"

[defaults.strange_attractor.params]
dim = 0.82

[defaults.strange_attractor.style]
glow = "strong"
colormap = "spectrum"
