[project]
name = "phasor"
version = "0.0.1"
description = "GPU-rendered math animations that an AI can see, check and fix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "numpy>=1.26",
    "pillow>=13.0.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# OpenGL raster + id/solo passes. Needed for tiers A and B.
gl = ["moderngl>=5.12"]
# CUDA compute. The [ctk] extra pulls NVRTC and cudart from pip,
# so users need neither the CUDA Toolkit nor a C++ compiler.
gpu = ["cupy-cuda12x[ctk]>=13.3"]
# Video encoding (NVENC when the driver supports it, libx264 otherwise).
encode = ["av>=14"]
all = ["phasor[gl,gpu,encode]"]

[project.scripts]
phasor = "phasor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phasor"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["SPEC.md"]  # the owner's design doc; never reformat it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests hold dense tables of cases; long lines and literal match strings are fine there.
"tests/*" = ["E501", "RUF043"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gl: needs an OpenGL 4.3 context (skipped automatically when none is available)",
    "gpu: needs a working CUDA device (skipped automatically when none is available)",
    "slow: takes more than a few seconds",
]

# ---------------------------------------------------------------- import-linter
# Contract 6 of SPEC.md, plus the placements fixed in docs/decisions/0001-layers.md.
# Higher layers may import lower ones, never the reverse.
[tool.importlinter]
root_package = "phasor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layer order (SPEC contract 6, ADR 0001)"
type = "layers"
layers = [
    "phasor.cli | phasor.gui | phasor.mcp | phasor.sketch",
    "phasor.scene",
    "phasor.engine",
    "phasor.domains",
    "phasor.render",
    "phasor.inspect",
    "phasor.layout",
    "phasor.time",
    "phasor.style",
    "phasor.core",
]

[[tool.importlinter.contracts]]
name = "GPU-free layers import no GPU, GL or video library (SPEC contract 6)"
type = "forbidden"
source_modules = [
    "phasor.core",
    "phasor.style",
    "phasor.time",
    "phasor.layout",
]
forbidden_modules = [
    "cupy",
    "cuda",
    "moderngl",
    "moderngl_window",
    "av",
    "glfw",
]
